# ~/.tmux.conf

# ---------- Core options ----------
set -g default-terminal "tmux-256color"          # tmux's own terminfo inside tmux
set -ga terminal-overrides ",st-256color:RGB,xterm-256color:RGB,*256col*:RGB"  # true color
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                           # no lag on Esc in vim
set -g focus-events on
set -g set-clipboard on
set -g base-index 1                              # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys emacs
set -g display-time 2000

# ---------- Key bindings ----------
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ---------- Plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'janoamaral/tokyo-night-tmux'

set -g @yank_with_mouse on
set -g @override_copy_command 'xclip -selection clipboard -in'

# Tokyo Night theme
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 
set -g @tokyo-night-tmux_window_tidy_icons 0
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_date_format MYD
set -g @tokyo-night-tmux_time_format 12H
set -g @tokyo-night-tmux_show_music 1
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_netspeed_iface "wlan0"
set -g @tokyo-night-tmux_netspeed_showip 1
set -g @tokyo-night-tmux_netspeed_refresh 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_hostname 1

# TPM must stay at the very bottom
run '~/.tmux/plugins/tpm/tpm'
